<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<!-- Seguridad (P1): referrer estricto y anti-clickjacking por JS (frame-ancestors no vale por <meta> en GitHub
     Pages). La CSP de recursos NO se pone aquí todavía: esta página usa el SDK de Firebase y el popup de Google,
     y una CSP mal ajustada rompe el login; hay que probarla en navegador antes (ver docs del pentest). -->
<meta name="referrer" content="strict-origin-when-cross-origin">
<script>if (self !== top) { try { top.location = self.location; } catch (e) { document.documentElement.style.display = "none"; } }</script>
<meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#18211b" media="(prefers-color-scheme: dark)">
<title>Distro</title>
<meta name="description" content="Reparte los gastos del grupo: mira los saldos, apunta gastos y marca lo que ya has pagado.">
<meta property="og:type" content="website">
<meta property="og:site_name" content="Distro">
<meta property="og:title" content="Distro en la web">
<meta property="og:description" content="Mira los saldos de tu grupo y apunta gastos desde el navegador.">
<meta property="og:image" content="https://montarc.es/og.png">
<meta property="og:image:width" content="1024">
<meta property="og:image:height" content="500">
<meta name="twitter:card" content="summary_large_image">
<link rel="preconnect" href="https://www.gstatic.com">
<link rel="preconnect" href="https://firestore.googleapis.com">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="icon-180.png">
<meta name="apple-mobile-web-app-title" content="Distro">
<style>
  :root { color-scheme:light dark; --bg:#f4f8f5; --card:#fff; --ink:#18231d; --muted:#5b6b62; --green:#2f8f0a; --green2:#1b5e05; --on:#fff; --line:#dde8e0; --bad:#b3261e; --soft:#eaf4e4; --warn:#8a5a00; --warnbg:#fff4d6; --shadow:0 1px 3px rgba(20,60,20,.10); }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#0f1511; --card:#18211b; --ink:#e7efe9; --muted:#9db0a4; --green:#6fcf45; --green2:#8bdc66; --on:#0b1a10; --line:#2a382f; --bad:#f2b8b5; --soft:#223326; --warn:#f3d27a; --warnbg:#3a2f12; --shadow:none; }
  }
  * { box-sizing:border-box; }
  [hidden] { display:none !important; }
  html { -webkit-text-size-adjust:100%; scroll-padding-top:120px; }
  body { margin:0; background:var(--bg); color:var(--ink); font:16px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  a, button, label { touch-action:manipulation; -webkit-tap-highlight-color:transparent; }
  :focus-visible { outline:3px solid var(--green); outline-offset:2px; }
  .in { max-width:520px; margin:0 auto; padding:0 16px; }

  /* Cabecera fija: atrás o logo, título, «+ Gasto», cuenta y pestañas */
  .bar { position:sticky; top:0; z-index:4; background:var(--card); border-bottom:1px solid var(--line); padding-top:env(safe-area-inset-top); }
  .bar .top { display:flex; align-items:center; gap:8px; min-height:60px; }
  .bar .back, .bar .logo { flex:none; width:44px; height:44px; margin-left:-8px; display:inline-flex; align-items:center; justify-content:center; border-radius:50%; color:var(--ink); text-decoration:none; font-size:1.35rem; transition:background-color .15s; }
  .bar .back:hover { background:var(--soft); }
  .bar .logo img { width:30px; height:30px; border-radius:8px; }
  .bar .t { flex:1; min-width:0; }
  .bar h1 { font-size:1.15rem; line-height:1.25; margin:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .bar #sub { display:block; color:var(--muted); font-size:.82rem; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .bar #add { flex:none; min-height:40px; padding:4px 14px; font-size:.95rem; }
  .bar .acct { flex:none; width:40px; min-height:40px; height:40px; padding:0; border-radius:50%; border:1.5px solid var(--line); color:var(--ink); background:var(--soft); font-weight:800; }
  .bar .acct:hover { border-color:var(--green); background:var(--soft); }
  .tabs { display:flex; gap:24px; }
  .tabs a { color:var(--muted); text-decoration:none; font-weight:700; padding:8px 2px 9px; border-bottom:3px solid transparent; transition:color .15s, border-color .15s; }
  .tabs a:hover { color:var(--ink); }
  .tabs a[aria-current="page"] { color:var(--green); border-color:var(--green); }

  main { padding-top:4px; padding-bottom:calc(48px + env(safe-area-inset-bottom)); }
  p, small { color:var(--muted); margin:6px 0; }
  h2 { font-size:1.05rem; margin:24px 0 4px; text-wrap:balance; }
  .card { background:var(--card); border:1.5px solid var(--line); border-radius:18px; padding:14px 16px; margin:14px 0; box-shadow:var(--shadow); }
  .grow { flex:1; min-width:0; }
  .name { font-weight:700; display:block; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .amt { font-variant-numeric:tabular-nums; white-space:nowrap; }
  .pos { color:var(--green); } .neg { color:var(--bad); }
  button, input, select { font:inherit; border-radius:999px; border:1.5px solid var(--green); padding:9px 16px; min-height:44px; }
  button { background:transparent; color:var(--green); font-weight:700; cursor:pointer; transition:background-color .15s, color .15s, border-color .15s, transform .1s; }
  button:hover:not(:disabled) { background:var(--soft); }
  button:active:not(:disabled) { transform:scale(.97); }
  button.on, .btn.on { background:var(--green); color:var(--on); }
  button.on:hover:not(:disabled) { background:var(--green2); }
  button:disabled { opacity:.45; cursor:default; }
  .btn { display:block; width:100%; margin-top:10px; padding:13px; text-align:center; text-decoration:none; border-radius:14px; border:1.5px solid var(--green); color:var(--green); font-weight:700; }
  input, select { background:var(--card); color:var(--ink); width:100%; margin:6px 0; border-color:var(--line); border-radius:14px; transition:border-color .15s; }
  input:hover, select:hover { border-color:var(--muted); }
  input:focus, select:focus { border-color:var(--green); }
  input[aria-invalid="true"] { border-color:var(--bad); }
  label { display:block; font-weight:600; margin-top:12px; }
  .btn.google { background:#fff; color:#1f1f1f; border-color:#dadce0; }
  .btn.google:hover:not(:disabled) { background:#f3f5f3; }
  .note { border-radius:14px; padding:10px 14px; margin:14px 0 4px; background:var(--soft); color:var(--ink); }
  .note.warn { background:var(--warnbg); color:var(--warn); }
  .note.bad { background:transparent; border:1.5px solid var(--bad); color:var(--bad); }
  .note button { margin-top:8px; }
  .av { width:40px; height:40px; border-radius:50%; background:var(--green); color:var(--on); display:inline-flex; align-items:center; justify-content:center; font-weight:800; flex:none; font-size:1.1rem; }
  .av.emoji { background:var(--soft); font-size:1.4rem; }

  /* Listas: tus grupos y «¿quién eres?» */
  .list { background:var(--card); border:1.5px solid var(--line); border-radius:18px; margin:14px 0; overflow:hidden; box-shadow:var(--shadow); }
  .list > a, .list > button { display:flex; align-items:center; gap:12px; width:100%; min-height:64px; padding:10px 16px; border:0; border-bottom:1px solid var(--line); border-radius:0; background:transparent; color:var(--ink); text-align:left; text-decoration:none; font-weight:600; transition:background-color .15s; }
  .list > :last-child { border-bottom:0; }
  .list > a:hover, .list > button:hover:not(:disabled) { background:var(--soft); }
  .list > button:active:not(:disabled) { transform:none; }
  .list small { display:block; margin:0; font-weight:400; }
  .list .chev { color:var(--muted); font-size:1.3rem; }

  /* Tablas de gastos y saldos */
  table { width:100%; border-collapse:collapse; font-size:.95rem; table-layout:auto; }
  caption { text-align:left; font-weight:800; font-size:1.05rem; padding:16px 0 6px; }
  th { text-align:left; font-weight:600; color:var(--muted); font-size:.8rem; padding:6px 4px; border-bottom:1.5px solid var(--line); }
  td { padding:11px 4px; border-bottom:1px solid var(--line); vertical-align:top; }
  th.n, td.n { text-align:right; }
  td.n { font-variant-numeric:tabular-nums; white-space:nowrap; }
  .sr { position:absolute; width:1px; height:1px; overflow:hidden; clip:rect(0 0 0 0); white-space:nowrap; }
  tbody th { font-size:.95rem; color:var(--ink); border-bottom:1px solid var(--line); padding:11px 4px; }
  td.p, th.p { font-weight:600; max-width:7.5em; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  td.s { font-weight:800; }
  td.d { color:var(--muted); font-size:.85rem; white-space:nowrap; width:1%; padding-top:12px; }
  td .what { font-weight:700; display:block; overflow-wrap:anywhere; }
  td small { display:block; margin:0; font-size:.83rem; }
  td.big { font-weight:700; }
  tr.xfer .what, tr.xfer td.big { color:var(--muted); font-weight:600; }
  .foot { font-size:.85rem; margin:8px 0 0; }
  .pay { display:flex; align-items:center; gap:10px; padding:10px 0; border-bottom:1px solid var(--line); }
  .pay .who { flex:1; min-width:0; overflow-wrap:anywhere; }
  .pay .arrow { color:var(--muted); }
  .pay .amt { font-weight:800; }
  .pay button { flex:none; min-height:40px; padding:4px 12px; font-size:.88rem; }

  .chips { display:flex; flex-wrap:wrap; gap:8px; margin:6px 0; }
  .chips button { min-height:40px; padding:4px 14px; border-color:var(--line); color:var(--ink); font-weight:600; }
  .chips button[aria-pressed="true"] { background:var(--green); border-color:var(--green); color:var(--on); }
  .sheet { position:fixed; inset:0; background:rgba(0,0,0,.4); display:flex; align-items:flex-end; justify-content:center; z-index:5; overscroll-behavior:contain; }
  .sheet > form { background:var(--card); width:100%; max-width:520px; max-height:92vh; overflow:auto; overscroll-behavior:contain; border-radius:24px 24px 0 0; padding:18px 18px calc(18px + env(safe-area-inset-bottom)); }
  .sheet h2 { margin:0 0 4px; }
  .split { display:flex; gap:8px; }
  .split > * { flex:1; }
  .or { text-align:center; margin:16px 0 4px; }
  .sk { height:56px; border-radius:14px; margin:12px 0; background:linear-gradient(90deg,var(--line),var(--soft),var(--line)); background-size:200% 100%; animation:sh 1.2s linear infinite; }
  @keyframes sh { to { background-position:-200% 0; } }
  .center { text-align:center; }
  .link { background:none; border:0; color:var(--green); padding:8px 4px; min-height:0; font-weight:700; text-decoration:underline; }
  .menu { position:absolute; right:max(16px, calc(50% - 244px)); top:calc(100% + 6px); background:var(--card); color:var(--ink); border:1px solid var(--line); border-radius:16px; padding:8px; box-shadow:0 6px 20px rgba(0,0,0,.18); z-index:6; min-width:220px; max-width:calc(100vw - 32px); }
  .menu small { display:block; padding:4px 10px 8px; overflow-wrap:anywhere; }
  .menu button { display:block; width:100%; text-align:left; border:0; border-radius:10px; color:var(--ink); font-weight:600; }
  .menu button.danger { color:var(--bad); }
  @media (prefers-reduced-motion: reduce) { * { animation:none !important; transition:none !important; } }
</style>
</head>
<body>
<header class="bar">
  <div class="in">
    <div class="top">
      <a class="back" id="back" href="#/" hidden><span aria-hidden="true">←</span></a>
      <a class="logo" id="logo" href="#/" translate="no"><img src="icon-192.png" width="30" height="30" alt="Distro"></a>
      <div class="t"><h1 id="h1"></h1><span id="sub"></span></div>
      <button class="on" id="add" type="button" hidden></button>
      <button class="acct" id="acct" type="button" hidden aria-haspopup="menu" aria-expanded="false"></button>
    </div>
    <nav class="tabs" id="tabs" hidden></nav>
  </div>
  <div class="menu" id="menu" hidden role="menu"></div>
</header>
<main class="in">
  <div id="status" role="status" aria-live="polite"></div>
  <div id="skel"><div class="sk"></div><div class="sk"></div><div class="sk"></div></div>
  <div id="view"></div>
</main>
<div class="sheet" id="sheet" hidden></div>
<script type="module" src="app.js"></script>
<script>
  // Si no carga Firebase (sin conexión o bloqueado), se dice en vez de dejar la página en blanco.
  setTimeout(function () {
    if (window.distroReady) return;
    var l = (navigator.language || "en").toLowerCase();
    document.getElementById("skel").hidden = true;
    var n = document.getElementById("status");
    n.className = "note bad";
    n.textContent = l.indexOf("ca") === 0 ? "No s'ha pogut carregar. Revisa la connexió i torna a obrir la pàgina." : l.indexOf("es") === 0 ? "No se ha podido cargar. Revisa tu conexión y vuelve a abrir la página." : "Couldn't load. Check your connection and reopen the page.";
  }, 12000);
  if ("serviceWorker" in navigator) addEventListener("load", function () { navigator.serviceWorker.register("sw.js").catch(function () {}); });
</script>
</body>
</html>
