<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Invitación a Distro</title>
<style>
  :root { --bg:#f6faf7; --card:#fff; --ink:#18231d; --muted:#5b6b62; --green:#1f7a4d; --on:#fff; --line:#d9e5dd; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#101612; --card:#18211b; --ink:#e7efe9; --muted:#9db0a4; --green:#5fc08c; --on:#0b1a10; --line:#2a382f; }
  }
  * { box-sizing: border-box; }
  body { margin:0; min-height:100vh; display:grid; place-items:center; padding:16px; background:var(--bg); color:var(--ink);
         font:16px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  main { width:100%; max-width:380px; background:var(--card); border:1px solid var(--line); border-radius:20px; padding:28px 24px; text-align:center; }
  h1 { margin:0 0 4px; font-size:1.4rem; }
  p { margin:8px 0; color:var(--muted); }
  .code { margin:20px 0 8px; font-size:2.4rem; font-weight:800; letter-spacing:.2em; padding-left:.2em; }
  .btn { display:block; width:100%; margin-top:12px; padding:14px; border-radius:14px; border:1px solid var(--green);
         font:inherit; font-weight:700; text-decoration:none; cursor:pointer; }
  .primary, .primary:visited { background:var(--green); color:var(--on); }
  .ghost { background:transparent; color:var(--green); }
  small { display:block; margin-top:16px; color:var(--muted); }
  .bad { color:#b3261e; }
</style>
</head>
<body>
<main>
  <h1 data-tr="h1">Te han invitado a un grupo</h1>
  <p data-trh="sub">Reparte los gastos con tus amigos en <strong>Distro</strong>.</p>
  <div id="ok" hidden>
    <div class="code" id="code"></div>
    <a class="btn primary" id="open" href="#" data-tr="open">Abrir en Distro</a>
    <button class="btn ghost" id="copy" type="button" data-tr="copy">Copiar código</button>
    <small data-tr="small">Si aún no tienes Distro, instálala, pulsa «Unirse con código» e introduce este código. Caduca a los 7 días de crearlo.</small>
  </div>
  <p id="bad" class="bad" hidden data-tr="bad">Este enlace no es válido. Pídele a quien te invitó que te mande otro.</p>
</main>
<script>
  var TX = {"title": {"es": "Invitación a Distro", "en": "Distro invitation"}, "h1": {"es": "Te han invitado a un grupo", "en": "You've been invited to a group"}, "sub": {"es": "Reparte los gastos con tus amigos en <strong>Distro</strong>.", "en": "Split expenses with your friends on <strong>Distro</strong>."}, "open": {"es": "Abrir en Distro", "en": "Open in Distro"}, "copy": {"es": "Copiar código", "en": "Copy code"}, "small": {"es": "Si aún no tienes Distro, instálala, pulsa «Unirse con código» e introduce este código. Caduca a los 7 días de crearlo.", "en": "If you don't have Distro yet, install it, tap “Join with a code” and enter this code. It expires 7 days after it was created."}, "bad": {"es": "Este enlace no es válido. Pídele a quien te invitó que te mande otro.", "en": "This link isn't valid. Ask whoever invited you to send another one."}, "copied": {"es": "Copiado ✓", "en": "Copied ✓"}, "hold": {"es": "Mantén pulsado el código para copiarlo", "en": "Press and hold the code to copy it"}};
  var q = new URLSearchParams(location.search).get("lang");
  var L = (q || navigator.language || "en").toLowerCase().indexOf("es") === 0 ? "es" : "en";
  function tr(k) { return TX[k][L]; }
  document.documentElement.lang = L; document.title = tr("title");
  [].forEach.call(document.querySelectorAll("[data-tr]"), function (n) { n.textContent = tr(n.getAttribute("data-tr")); });
  [].forEach.call(document.querySelectorAll("[data-trh]"), function (n) { n.innerHTML = tr(n.getAttribute("data-trh")); });
  var raw = new URLSearchParams(location.search).get("c") || "";
  var code = raw.toUpperCase().replace(/[^A-Z0-9]/g, "");
  if (code.length === 6) {
    document.getElementById("ok").hidden = false;
    document.getElementById("code").textContent = code;
    document.getElementById("open").href = "distro://j?c=" + code;
    document.getElementById("copy").onclick = function () {
      var b = this;
      (navigator.clipboard ? navigator.clipboard.writeText(code) : Promise.reject())
        .then(function () { b.textContent = tr("copied"); })
        .catch(function () { b.textContent = tr("hold"); });
    };
  } else {
    document.getElementById("bad").hidden = false;
  }
</script>
</body>
</html>
