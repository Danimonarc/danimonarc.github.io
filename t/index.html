<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Marcar un ticket en Distro</title>
<style>
  :root { --bg:#f6faf7; --card:#fff; --ink:#18231d; --muted:#5b6b62; --green:#2f8f0a; --green2:#1b5e05; --on:#fff; --line:#dde8e0; --bad:#b3261e; --soft:#eaf4e4; --shadow:0 1px 3px rgba(20,60,20,.10); }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#0f1511; --card:#18211b; --ink:#e7efe9; --muted:#9db0a4; --green:#6fcf45; --green2:#1b5e05; --on:#0b1a10; --line:#2a382f; --bad:#f2b8b5; --soft:#223326; --shadow:none; }
  }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--ink); font:16px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  .hero { background:linear-gradient(135deg,#37b00a,var(--green2)); color:#fff; padding:18px 20px 26px; border-radius:0 0 28px 28px; }
  .hero .brand { font-weight:800; letter-spacing:.02em; opacity:.85; }
  .hero h1 { margin:14px 0 2px; font-size:1.7rem; line-height:1.15; }
  .hero p { margin:0; color:rgba(255,255,255,.85); }
  main { max-width:520px; margin:0 auto; padding:4px 16px 120px; }
  p, small { color:var(--muted); margin:6px 0; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:20px; padding:14px 16px; margin:12px 0; box-shadow:var(--shadow); }
  .row { display:flex; align-items:center; gap:10px; justify-content:space-between; }
  .name { font-weight:700; font-size:1.05rem; } .price { font-variant-numeric:tabular-nums; font-weight:700; }
  button, input { font:inherit; border-radius:999px; border:1.5px solid var(--green); padding:9px 16px; }
  button { background:transparent; color:var(--green); font-weight:700; cursor:pointer; }
  button.on { background:var(--green); color:var(--on); }
  button:disabled { opacity:.35; cursor:default; }
  input { background:var(--card); color:var(--ink); width:100%; margin:8px 0; border-color:var(--line); border-radius:14px; }
  .chips { display:flex; flex-wrap:wrap; gap:8px; margin-top:8px; }
  .qty { display:flex; align-items:center; gap:14px; } .qty b { min-width:1.5em; text-align:center; font-size:1.2rem; }
  .qty button { width:42px; height:42px; padding:0; font-size:1.3rem; line-height:1; }
  .err { color:var(--bad); }
  #status { margin:14px 4px 0; }
  .bar { position:fixed; left:0; right:0; bottom:0; background:var(--card); border-top:1px solid var(--line); padding:10px 16px calc(10px + env(safe-area-inset-bottom)); }
  .bar > div { max-width:520px; margin:0 auto; }
  .bar button#ok { width:100%; padding:13px; font-size:1.05rem; }
  .total { font-size:1.25rem; font-weight:800; }
  #saved { margin:4px 0 0; text-align:center; min-height:1.4em; }
  .me { margin:14px 4px 0; } .me a { color:var(--green); font-weight:700; }
  .ad { margin:16px 0; border:1px dashed var(--line); border-radius:14px; padding:8px 12px 12px; text-align:center; background:var(--soft); }
  .ad small { display:block; font-size:.7rem; letter-spacing:.08em; text-transform:uppercase; margin:0 0 4px; }
  .ad b { display:block; } .ad span { color:var(--muted); font-size:.9rem; }
</style>
</head>
<body>
<header class="hero">
  <div class="brand">distro</div>
  <h1 id="title">Tu ticket</h1>
  <p id="group">&nbsp;</p>
</header>
<main>
  <p id="status">Cargando…</p>
  <div id="who" hidden></div>
  <div id="items"></div>
  <!-- Hueco del banner. Por ahora es publicidad propia; aquí iría el código del anuncio de AdSense (con el aviso de cookies). -->
  <div class="ad" id="ad" hidden>
    <small>Publicidad</small>
    <b>Distro: reparte los gastos sin hacer cuentas</b>
    <span>Escanea el ticket y cada uno marca lo suyo.</span>
  </div>
  <p style="text-align:center"><small>Quien pagó cierra el ticket desde la app y se reparte.</small></p>
</main>
<div class="bar" id="mine" hidden>
  <div>
    <div class="row"><span>Tu parte <small>(aprox.)</small></span><span class="total" id="total"></span></div>
    <button id="ok" class="on" style="margin-top:8px">Confirmar mi parte</button>
    <p id="saved"></p>
  </div>
</div>
<script>
"use strict";
// Clave pública de la app web de Firebase: no es un secreto; los datos los protegen las reglas de Firestore.
var KEY = "AIzaSyBgMRGHZhp0Tx8ww88clCUfnDAQy4_RZbI", PROJECT = "distro-58a19";
var DOCS = "projects/" + PROJECT + "/databases/(default)/documents";
var API = "https://firestore.googleapis.com/v1/" + DOCS;
var q = new URLSearchParams(location.search);
var code = (q.get("c") || "").toUpperCase().replace(/[^A-Z0-9]/g, "");
var ticketId = (q.get("t") || "").replace(/\D/g, "");
var $ = function (id) { return document.getElementById(id); };
var S = { last: null, uid: null, token: null, group: null, groupId: null, ticket: null, me: null, busy: false };

function fail(msg) { $("status").textContent = msg; $("status").className = "err"; }
function store(k, v) { try { v == null ? localStorage.removeItem(k) : localStorage.setItem(k, v); } catch (e) {} }
function load(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }

// --- Sesión anónima (se guarda para volver con la misma cuenta) ---
async function auth() {
  var rt = load("distro.rt");
  if (rt) {
    var r = await fetch("https://securetoken.googleapis.com/v1/token?key=" + KEY, {
      method: "POST", headers: { "Content-Type": "application/x-www-form-urlencoded" },
      body: "grant_type=refresh_token&refresh_token=" + encodeURIComponent(rt)
    });
    if (r.ok) { var j = await r.json(); S.token = j.id_token; S.uid = j.user_id; store("distro.rt", j.refresh_token); return; }
  }
  var s = await fetch("https://identitytoolkit.googleapis.com/v1/accounts:signUp?key=" + KEY, {
    method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ returnSecureToken: true })
  });
  if (!s.ok) throw new Error("auth");
  var d = await s.json(); S.token = d.idToken; S.uid = d.localId; store("distro.rt", d.refreshToken);
}

async function call(url, opts) {
  opts = opts || {};
  opts.headers = Object.assign({ "Authorization": "Bearer " + S.token, "Content-Type": "application/json" }, opts.headers || {});
  var r = await fetch(url, opts);
  if (r.status === 401) { await auth(); opts.headers.Authorization = "Bearer " + S.token; r = await fetch(url, opts); }
  return r;
}

// --- Valores de Firestore. Los enteros se dejan como texto: los ids no caben en un número de JS. ---
function dec(v) {
  if ("stringValue" in v) return v.stringValue;
  if ("integerValue" in v) return v.integerValue;
  if ("booleanValue" in v) return v.booleanValue;
  if ("mapValue" in v) { var o = {}, f = v.mapValue.fields || {}; for (var k in f) o[k] = dec(f[k]); return o; }
  if ("arrayValue" in v) return (v.arrayValue.values || []).map(dec);
  return null;
}
function mv(fields) { return { mapValue: { fields: fields } }; }
function kv(k, v) { var o = {}; o[k] = v; return o; }
function int(x) { return { integerValue: String(x) }; }
var tick = function (s) { return "`" + s + "`"; };

async function getDoc(path) {
  var r = await call(API + "/" + path);
  if (r.status === 404) return null;
  if (!r.ok) throw new Error(path + " " + r.status);
  return dec({ mapValue: { fields: (await r.json()).fields || {} } });
}
async function patch(path, mask, fields) {
  var qs = mask.map(function (m) { return "updateMask.fieldPaths=" + encodeURIComponent(m); }).join("&");
  var r = await call(API + "/" + path + "?" + qs, { method: "PATCH", body: JSON.stringify({ fields: fields }) });
  if (!r.ok) throw new Error("patch " + r.status);
}
// Añadir o quitar un elemento de una lista sin pisar a los demás (como arrayUnion/arrayRemove).
async function listChange(path, field, values, add) {
  var t = { fieldPath: field };
  t[add ? "appendMissingElements" : "removeAllFromArray"] = { values: values };
  var r = await call("https://firestore.googleapis.com/v1/projects/" + PROJECT + "/databases/(default)/documents:commit", {
    method: "POST", body: JSON.stringify({ writes: [{ transform: { document: DOCS + "/" + path, fieldTransforms: [t] } }] })
  });
  if (!r.ok) throw new Error("commit " + r.status);
}

// --- Arranque ---
async function start() {
  if (code.length !== 6 || !ticketId) return fail("Este enlace no es válido. Pídele a quien te lo envió que lo mande otra vez.");
  try { await auth(); } catch (e) { return fail("No se ha podido conectar. Inténtalo de nuevo."); }
  var inv = await getDoc("invites/" + code).catch(function () { return null; });
  if (!inv || !inv.groupId) return fail("El enlace ha caducado. Pídele a quien te lo envió que lo mande otra vez.");
  S.groupId = inv.groupId;
  try { await listChange("groups/" + S.groupId, "memberUids", [{ stringValue: S.uid }], true); }
  catch (e) { return fail("No se ha podido entrar en el grupo."); }
  S.last = load("distro.me." + S.groupId);
  await refresh();
  setInterval(function () { if (!S.busy) refresh(); }, 4000);
}

async function refresh() {
  try {
    var g = await getDoc("groups/" + S.groupId), t = await getDoc("groups/" + S.groupId + "/tickets/" + ticketId);
    if (!g) return fail("El grupo ya no existe.");
    if (!t) return fail("Este ticket ya se ha cerrado. Quien pagó lo apuntó como gasto en Distro.");
    S.group = g; S.ticket = t; render();
  } catch (e) { fail("Sin conexión; reintentando…"); }
}

// --- Pantalla ---
function esc(s) { var d = document.createElement("div"); d.textContent = s; return d.innerHTML; }
function eur(c) { return (Number(c) / 100).toLocaleString("es-ES", { style: "currency", currency: "EUR" }); }
function personName(id) { var p = (S.group.people || []).find(function (x) { return x.id === id; }); return p ? p.name : "?"; }

var draft = {}, dirty = {};
function server(it) {
  var a = (S.ticket.claims || {})[it.id] || {}, sb = a.sharedBy || [];
  return { u: Number((a.units || {})[S.me] || 0), sh: a.shared === true, inn: sb.indexOf(S.me) >= 0 };
}
function val(it) { return dirty[it.id] ? draft[it.id] : server(it); }
function change(id, patchObj) {
  var it = S.ticket.items.find(function (x) { return x.id === id; });
  draft[id] = Object.assign({}, val(it), patchObj); dirty[id] = true;
  $("saved").textContent = ""; render();
}

function render() {
  $("status").className = ""; $("status").textContent = ""; $("group").textContent = "Grupo «" + S.group.name + "»";
  $("title").textContent = S.ticket.title || "Ticket";
  var people = S.group.people || [];
  if (!S.me || !people.some(function (p) { return p.id === S.me; })) return renderWho(people);
  $("who").hidden = true; $("ad").hidden = false;
  html = '<p class="me">Marcas como <b>' + esc(personName(S.me)) + '</b> · <a href="#" data-a="chg">cambiar</a></p>';
  var claims = S.ticket.claims || {}, total = 0, html;
  (S.ticket.items || []).forEach(function (it) {
    var a = claims[it.id] || {}, units = a.units || {}, sharedBy = a.sharedBy || [], d = val(it);
    var q = Number(it.quantity) || 1, cents = Number(it.totalCents);
    var others = Object.keys(units).reduce(function (n, p) { return n + (p === S.me ? 0 : Number(units[p])); }, 0);
    var shareIds = sharedBy.filter(function (p) { return p !== S.me; }); if (d.inn) shareIds.push(S.me);
    total += d.sh ? (d.inn && shareIds.length ? Math.round(cents / shareIds.length) : 0) : Math.round(cents / q) * d.u;
    html += '<div class="card"><div class="row"><span><span class="name">' + esc(it.name) + '</span><br><small>' + (q > 1 ? q + " × " + eur(cents / q) : "") + '</small></span><span class="price">' + eur(cents) + '</span></div>';
    if (!d.sh) {
      var who = Object.keys(units).filter(function (p) { return p !== S.me; }).map(function (p) { return esc(personName(p)) + " " + units[p]; }).join(", ");
      html += '<div class="row" style="margin-top:8px"><div class="qty"><button data-a="u" data-i="' + it.id + '" data-d="-1"' + (d.u <= 0 ? " disabled" : "") + '>−</button><b>' + d.u + '</b><button data-a="u" data-i="' + it.id + '" data-d="1"' + (d.u + others >= q ? " disabled" : "") + '>+</button></div>' +
        '<button data-a="s" data-i="' + it.id + '" data-v="1">Compartido</button></div>' + (who ? "<small>También: " + who + "</small>" : "");
    } else {
      var names = shareIds.map(function (p) { return esc(personName(p)); }).join(", ") || "nadie todavía";
      html += '<div class="row" style="margin-top:8px"><button class="' + (d.inn ? "on" : "") + '" data-a="c" data-i="' + it.id + '">' + (d.inn ? "Yo también ✓" : "Yo también") + '</button>' +
        '<button data-a="s" data-i="' + it.id + '" data-v="0">Por unidades</button></div><small>Se divide a partes iguales. Compartido con: ' + names + '.</small>';
    }
    html += "</div>";
  });
  $("items").innerHTML = html;
  $("mine").hidden = false; $("total").textContent = eur(total);
  $("ok").disabled = Object.keys(dirty).length === 0;
}

function renderWho(people) {
  $("items").innerHTML = ""; $("mine").hidden = true;
  var w = $("who"); w.hidden = false;
  w.innerHTML = '<div class="card"><p><b>¿Quién eres?</b> Elige tu nombre para marcar lo tuyo.</p><div class="chips">' +
    people.map(function (p) { return '<button class="' + (p.id === S.last ? 'on' : '') + '" data-a="w" data-p="' + p.id + '">' + esc(p.name) + "</button>"; }).join("") +
    '</div><p>¿No estás en la lista?</p><input id="newname" maxlength="30" placeholder="Tu nombre"><button id="addme">Añadirme</button></div>';
  $("addme").onclick = async function () {
    var name = $("newname").value.trim(); if (!name) return;
    var id = (BigInt(Math.floor(Math.random() * 2 ** 30)) << 32n | BigInt(crypto.getRandomValues(new Uint32Array(1))[0])).toString();
    await listChange("groups/" + S.groupId, "people", [{ mapValue: { fields: { id: int(id), name: { stringValue: name } } } }], true).catch(function () { fail("No se ha podido añadirte."); });
    S.me = id; S.last = id; store("distro.me." + S.groupId, id); refresh();
  };
}

document.addEventListener("click", async function (e) {
  var b = e.target.closest("button[data-a], a[data-a], #ok"); if (!b || S.busy) return;
  if (b.dataset && b.dataset.a === "chg") { e.preventDefault(); S.last = S.me; S.me = null; draft = {}; dirty = {}; $("saved").textContent = ""; return render(); }
  if (b.id === "ok") return confirmMine(b);
  var a = b.dataset.a, i = b.dataset.i;
  if (a === "w") { S.me = b.dataset.p; store("distro.me." + S.groupId, S.me); return render(); }
  var it = S.ticket.items.find(function (x) { return x.id === i; }), d = val(it);
  if (a === "u") {
    var units = (((S.ticket.claims || {})[i] || {}).units) || {}, others = Object.keys(units).reduce(function (n, p) { return n + (p === S.me ? 0 : Number(units[p])); }, 0);
    change(i, { u: Math.max(0, Math.min(Number(it.quantity) - others, d.u + Number(b.dataset.d))) });
  } else if (a === "s") change(i, b.dataset.v === "1" ? { sh: true, inn: true } : { sh: false });
  else if (a === "c") change(i, { inn: !d.inn });
});

// Guarda de una vez lo que ha cambiado el usuario.
async function confirmMine(btn) {
  S.busy = true; btn.disabled = true; $("saved").textContent = "Guardando…";
  var tp = "groups/" + S.groupId + "/tickets/" + ticketId;
  try {
    for (var id in dirty) {
      var it = S.ticket.items.find(function (x) { return x.id === id; }), now = draft[id], old = server(it);
      if (now.u !== old.u) {
        var f = now.u > 0 ? { claims: mv(kv(id, mv({ units: mv(kv(S.me, int(now.u))) }))) } : {};
        await patch(tp, ["claims." + tick(id) + ".units." + tick(S.me)], f);
      }
      if (now.sh !== old.sh) await patch(tp, ["claims." + tick(id) + ".shared"], { claims: mv(kv(id, mv({ shared: { booleanValue: now.sh } }))) });
      if (now.inn !== old.inn) await listChange(tp, "claims." + tick(id) + ".sharedBy", [int(S.me)], now.inn);
    }
    draft = {}; dirty = {};
    await refresh(); $("saved").textContent = "✓ Guardado. Puedes volver a cambiarlo cuando quieras.";
  } catch (err) { $("saved").textContent = ""; fail("No se ha podido guardar. Inténtalo de nuevo."); }
  S.busy = false; render();
}

start();
</script>
</body>
</html>
